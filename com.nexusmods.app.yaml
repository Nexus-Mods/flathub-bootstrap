id: com.nexusmods.app
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet9
build-options:
  prepend-path: "/usr/lib/sdk/dotnet9/bin"
  append-ld-library-path: "/usr/lib/sdk/dotnet9/lib"
  prepend-pkg-config-path: "/usr/lib/sdk/dotnet9/lib/pkgconfig"

command: "NexusMods.App"

finish-args:
  - --device=dri              # rendering
  - --device=input            # inputs, specifically controllers
  - --socket=x11              # windowing
  - --share=ipc               # for X11 shared memory extension
  - --share=network           # network
  - --require-version=1.16.0  # required for device=input
  - --env=DOTNET_ROOT=/app/lib/dotnet
  # Minimum filesystem permissions to find game stores and launchers
  # Steam (https://github.com/erri120/GameFinder/blob/master/src/GameFinder.StoreHandlers.Steam/Services/SteamLocationFinder.cs)
  - --filesystem=xdg-data/Steam:ro                          # Steam (native)
  - --filesystem=~/.var/app/com.valvesoftware.Steam:ro      # Steam (Flatpak)
  # Heroic (https://github.com/erri120/GameFinder/blob/master/src/GameFinder.Launcher.Heroic/HeroicGOGHandler.cs)
  - --filesystem=xdg-config/heroic:ro                       # Heroic (native)
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl:ro  # Heroic (Flatpak)

modules:
  # NOTE: we can remove this install.sh script if we build the app self contained but that's only worth it if we also enable trimming which is currently unsupported
  - name: dotnet
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet9/bin/install.sh

  - name: app
    buildsystem: simple
    build-options:
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: 1  # opt out of sending telemetry
        DOTNET_NOLOGO: 1                # skips .NET welcome and telemetry messages
    sources:
      - type: git
        url: "https://github.com/Nexus-Mods/NexusMods.App.git"
        tag: "v0.11.1"
        commit: "24355e6fb1addaf81a04c11940dcaff8ff0416ec"
        x-checker-data: # https://github.com/flathub-infra/flatpak-external-data-checker?tab=readme-ov-file#git-checker
          type: git
          tag-pattern: "^([\\d.]+)$"
          is-important: true
      - nuget-sources.json
    build-commands:
      - dotnet publish -r linux-x64 src/NexusMods.App/NexusMods.App.csproj --no-self-contained --source ./nuget-sources --source /usr/lib/sdk/dotnet9/nuget/packages -p:DefineConstants=INSTALLATION_METHOD_FLATPAK -p:Version=0.11.1
      - mkdir -p ${FLATPAK_DEST}/bin
      - cp -r src/NexusMods.App/bin/Release/net9.0/linux-x64/publish/* ${FLATPAK_DEST}/bin

      # Application Icons: https://docs.flatpak.org/en/latest/conventions.html#application-icons
      - install -Dm644 src/NexusMods.App/icon.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # MetaInfo files: https://docs.flatpak.org/en/latest/conventions.html#metainfo-files
      - install -Dm644 src/NexusMods.App/com.nexusmods.app.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.xml
      # Release file: https://www.freedesktop.org/software/appstream/docs/chap-Metadata.html#tag-releases
      # - install -Dm644 src/NexusMods.App/com.nexusmods.app.releases.xml /app/share/metainfo/releases/${FLATPAK_ID}.xml
      # Desktop files: https://docs.flatpak.org/en/latest/conventions.html#desktop-files
      - install -Dm644 src/NexusMods.App/com.nexusmods.app.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key "Exec" --set-value "NexusMods.App %u" /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key "TryExec" /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key "X-AppImage-Integrate" /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key "X-AppImage-Name" /app/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --remove-key "X-AppImage-Arch" /app/share/applications/${FLATPAK_ID}.desktop
 
